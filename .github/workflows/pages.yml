name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript
        run: npm run check
      - name: Test catalogue and game rules
        run: npm run test:full
      - name: Build static release
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/pages

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright-core
          npx playwright install --with-deps chromium
      - name: Build static releases for QA
        run: |
          npm run build:pages
          npm run build:cloudflare
      - name: Run browser QA
        run: |
          PORT=4173 DATABASE_PATH=$(mktemp) node scripts/serve.mjs &
          SERVER_PID=$!
          timeout 30 bash -c 'until curl -s http://127.0.0.1:4173/api/catalog >/dev/null; do sleep 0.2; done'
          node scripts/browser-qa.mjs
          node scripts/browser-improvements-qa.mjs
          node scripts/browser-offline-qa.mjs
          kill $SERVER_PID
          PORT=4174 PAGES_BASE_PATH=/11-0-0/ node scripts/preview-pages.mjs &
          PREVIEW_PID=$!
          timeout 30 bash -c 'until curl -s http://127.0.0.1:4174/11-0-0/ >/dev/null; do sleep 0.2; done'
          QA_URL=http://localhost:4174/11-0-0/ node scripts/browser-pages-qa.mjs
          kill $PREVIEW_PID

  hosted-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Build hosted Sites adapter
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser-qa, hosted-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
